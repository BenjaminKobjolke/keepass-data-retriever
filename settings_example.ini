[General]
# Timeout in seconds before resetting the search window (default: 180 seconds = 3 minutes)
search_reset_timeout = 180
# Database idle timeout in seconds before locking (default: 3600 seconds = 1 hour)
database_idle_timeout = 3600
# Path to KeePass database file (required)
# For Windows paths, either use double backslashes:
# database_path = C:\\path\\to\\your\\database.kdbx
# Or use forward slashes (also works on Windows):
database_path = C:/path/to/your/database.kdbx
# Enable debug mode (default: false)
# Set to true to enable debug logging
debug_mode = false
# Window position mode (default: mouse)
# Options: 
#   'mouse' - position at mouse cursor
#   'center' - center in active window
#   'center_screen' - center on screen
# Examples:
# window_position = mouse
# window_position = center
# window_position = center_screen
window_position = mouse

[Hotkeys]
# Format: modifier1 + modifier2 + key
# Supported modifiers: 
#   - alt
#   - ctrl (internally translated to 'control')
#   - shift
# Note: 'win' key is not supported by the global_hotkeys package
#
# Examples of valid hotkeys:
#   alt + shift + F8
#   ctrl + shift + F8
#   alt + ctrl + F8
#   alt + shift + a
#
# Default fallback if invalid: alt + shift + F8
search_hotkey = alt + shift + F8
